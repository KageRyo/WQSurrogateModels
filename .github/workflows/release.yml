name: Release Python distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Manual publishing target; only TestPyPI is available here."
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi

permissions:
  contents: read

env:
  RELEASE_TAG_PREFIX: WQSurrogateModels-v

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
      github.event.action == 'published' &&
      startsWith(github.event.release.tag_name, 'WQSurrogateModels-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # The job that produces published distributions never builds the project
    # in an unlocked isolated environment: tests import the source tree, and
    # the release build backend is hash-locked in requirements-build.txt.
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "PyPI publication is blocked until the repository is public."
            exit 1
          fi

      - name: Require main for manual TestPyPI runs
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF_NAME" = "main"

      - name: Install locked development and package tooling
        run: uv sync --locked --no-build --no-install-project --extra dev --extra package

      - name: Verify release tag and title
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          expected_version="$(uv run --locked --no-build --no-sync python -c 'from wqsurrogatemodels import __version__; print(__version__)')"
          expected_tag="${RELEASE_TAG_PREFIX}${expected_version}"
          expected_name="WQSurrogateModels v${expected_version}"
          test "$RELEASE_TAG" = "$expected_tag"
          test "$RELEASE_NAME" = "$expected_name"

      - name: Run test suite
        run: uv run --locked --no-build --no-sync pytest

      - name: Build wheel and source distribution with the hash-locked backend
        run: uv build --build-constraints requirements-build.txt --require-hashes --out-dir dist

      - name: Validate distribution boundary
        run: uv run --locked --no-build --no-sync python scripts/validate_package.py dist

      - name: Check distribution metadata
        run: uv run --locked --no-build --no-sync twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/wqsurrogatemodels
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      startsWith(github.event.release.tag_name, 'WQSurrogateModels-v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wqsurrogatemodels
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
