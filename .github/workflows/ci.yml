name: CI

on:
  push:
    branches: [main]
    tags:
      - "WQSurrogateModels-v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Dependencies come only from hash-locked wheels in uv.lock; no
      # third-party source distribution or setup script runs.
      - name: Install locked dev dependencies
        run: uv sync --locked --no-build --extra dev --python "${{ matrix.python-version }}"

      - name: Run test suite
        run: uv run --locked --no-build --extra dev pytest -q --tb=short

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: wqsurrogatemodels:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test the Docker API runtime
        run: |
          container_name=wqsurrogatemodels-ci-smoke
          docker run --detach --rm --name "$container_name" --publish 127.0.0.1:18001:8001 wqsurrogatemodels:ci-test
          trap 'docker rm --force "$container_name" || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18001/api/v2/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18001/api/v2/ready
          response="$RUNNER_TEMP/assessment.json"
          curl --fail --silent --request POST http://127.0.0.1:18001/api/v2/assessment \
            --header 'Content-Type: application/json' \
            --data '{"DO":96.2,"BOD":1.5,"NH3N":0.22,"EC":171,"SS":2.6,"model_type":"direct_wqi5"}' \
            --output "$response"
          python -c 'import json, sys; payload = json.load(open(sys.argv[1])); assert payload["model_type"] == "direct_wqi5"; assert 0 <= payload["score"] <= 100' "$response"

  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify locked project environment
        run: |
          uv lock --check
          uv sync --locked --no-build --extra dev

      - name: Smoke test local API runtime
        run: uv run --locked --no-build --extra dev python scripts/smoke_api.py

  arm64-model-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ARM64 image with optional model dependencies
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.jetson
          platforms: linux/arm64
          push: false
          load: true
          tags: wqsurrogatemodels:jetson-ci-test
          build-args: |
            INSTALL_MODEL_EXTRAS=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check non-root ARM64 runtime and direct inference
        run: |
          docker run --rm --platform linux/arm64 wqsurrogatemodels:jetson-ci-test \
            python -c 'import os, xgboost; from wqsurrogatemodels.api import app; from wqsurrogatemodels.wqi import direct_wqi5_score; assert os.getuid() != 0; assert xgboost.__version__ == "3.2.0"; assert abs(direct_wqi5_score(do=96.2,bod=1.5,nh3n=0.22,ec=171,ss=2.6)-89.542) < 1e-6'

      - name: Build locked research ARM64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.edge-research
          platforms: linux/arm64
          push: false
          load: true
          tags: wqsurrogatemodels:research-ci-test
          cache-from: type=gha,scope=edge-research-arm64
          cache-to: type=gha,mode=max,scope=edge-research-arm64

      - name: Check non-root research imports and archived runtime
        run: |
          docker run --rm --platform linux/arm64 wqsurrogatemodels:research-ci-test \
            python -c 'import os, numpy, xgboost; from edge_replay.worker import replay; assert os.getuid() != 0; assert numpy.__version__ == "1.26.4"; assert xgboost.__version__ == "3.2.0"'
