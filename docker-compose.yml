services:
  wq-surrogate-models:
    build:
      context: .
      args:
        INSTALL_MODEL_EXTRAS: ${INSTALL_MODEL_EXTRAS:-false}
    # The image defaults to the unprivileged UID/GID 10001. Set CONTAINER_UID and
    # CONTAINER_GID to the host owner when the mounts are owner-readable only.
    user: "${CONTAINER_UID:-10001}:${CONTAINER_GID:-10001}"
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8001}:8001"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${LOCAL_MODEL_DIR:-./models}
        target: /app/models
        read_only: true
      - type: bind
        source: ${LOCAL_DATA_DIR:-./data}
        target: /app/data
        read_only: true
